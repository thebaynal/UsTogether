name: Verify and deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Verify web build
        run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_HGo6OUiSMKwQ5AmVfXvxjRPP
      VERCEL_PROJECT_ID: prj_BXk6UvqA0rakAOFaTb8nZvj0PPt1
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check deployment credential
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'Checks passed. Automatic deployment is disabled until VERCEL_TOKEN is configured.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Pull production settings
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@62.1.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build with production environment
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@62.1.0 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy verified build
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@62.1.0 deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
      - name: Deployment link
        if: env.VERCEL_TOKEN != ''
        run: echo 'Production site is available at https://ustogether-tau.vercel.app' >> "$GITHUB_STEP_SUMMARY"
